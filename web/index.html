<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LaLiga MVP Predictor</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<main class="page-shell">
		<header class="masthead">
			<div class="brand-mark" aria-hidden="true">10</div>
			<div>
				<p class="kicker">LaLiga / 4 Temporadas</p>
				<h1>MVP probability board</h1>
			</div>
			<div class="status"><span class="status-dot"></span><span id="status-text">Loading</span></div>
		</header>

		<section class="intro" aria-labelledby="board-title">
			<div>
				<p class="eyebrow">The shortlist</p>
				<h2 id="board-title">Predictor MVP (4 temporadas)</h2>
			</div>
			<p class="updated">Model ranking <span>•</span> Top 10</p>
		</section>

		<section id="predictions" class="prediction-grid" aria-live="polite"></section>
		<p id="error-message" class="message is-hidden">Predicciones no disponibles.</p>
	</main>
	<script src="/app.js"></script>
</body>
</html>
