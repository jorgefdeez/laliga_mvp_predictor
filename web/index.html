<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaLiga MVP Predictor</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <div class="field">
    <div class="center-circle"></div>
    <div class="center-line"></div>
    <div class="center-dot"></div>
    <div class="penalty-box left"></div>
    <div class="penalty-box right"></div>
    <div class="goal-box left"></div>
    <div class="goal-box right"></div>
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>
  </div>

  <div class="overlay"></div>

  <main>
    <header>
      <span class="trophy">🏆</span>
      <h1>LaLiga <span class="accent">MVP Predictor</span></h1>
      <p class="subtitle">Top 10 - Temporada 2026/27</p>
    </header>

    <div class="ranking" id="ranking">
  
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
